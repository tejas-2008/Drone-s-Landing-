[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-lifecycle"
version = "0.1.0"
description = "AI model lifecycle management: dependencies, training, evaluation, inference"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "questionary>=2.0",
    "click>=8.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.scripts]
ailc = "ai_lifecycle.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ai_lifecycle"]
